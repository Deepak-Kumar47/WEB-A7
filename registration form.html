<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        *,html{
            margin: o;
            padding: 0;
        }
        #box{
            width: 600px;
            height: 900px;
            background-color: red;
            margin: 0px;
            padding:20px 20px;
            box-sizing: border-box;

        }
    </style>
</head>
<body>
    <div id="box">
        <form>
            <div>
                <label>Your Name</label>
                <input type="name" placeholder="Enter your name"
            </div>
            <div>
                <label>Your email :</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div>
                <label>Your Phone no :</label>
                <input type="tel" placeholder="Enter your phone no">
            </div>
            <div>
                <label>Your DOB</label>
                <input type="date"/>
            </div>
            <div>
                <label>Your Gender</label>
                <input type="radio"name="gender"value="male"/>
                <label>Male</label>
                <input type="radio"name="gender"value="female"/>
                <label>Female</label>
                <input type="radio" name="gender" value="other"/>
                <label>Other</label>
            </div>
            <div>
                <label>Your Course</label>
                <input type="checkbox"name="course"value="html"/>
                <label>HTML</label>
                <input type="checkbox"name="course"value="css"/>
                <label>CSS</label>
                <input type="checkbox"name="course"value="javascript"/>
                <label>JavaScript</label>
            </div>
            <div>
                <label>Your Country :</label>
                <select>
                    <option value="india">India</option>
                    <option value="usa">USA</option>
                    <option value="uk">UK</option>
                    <option value="australia">Australia</option>
                </select>
            </div>
            <div>
                <label>Your Address :</label>
                <textarea placeorder="Enter your address"cols="20"rows="5"></textarea>
            </div>
            <div>
                <input type="submit" value="Submit"/>
                <input type="reset" value="Reset"/>
            </div>
        </form>
    </div>
    
</body>
</html>
